name: macOS build

# Builds the app for Apple Silicon Macs with the same scripts used by hand
# (fetch-tools-mac.sh and package-mac.sh): a .dmg with Qt and the command-line
# tools (yt-dlp, ffmpeg, spotdl, instaloader) inside. On a version tag (v*) the
# dmg is attached to the release of that tag; the text of the release is
# docs/release-notes/<tag>.md. A branch named ci/... runs the build without
# touching main.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Apple Silicon. Qt and ffmpeg come from Homebrew, whose libraries are built
    # for the macOS of the runner: the app runs on that version and on later ones.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and ffmpeg
        run: brew install qt ffmpeg ninja

      # yt-dlp, spotdl and instaloader as standalone executables, in vendor/mac.
      - name: Get the command-line tools
        run: ./fetch-tools-mac.sh

      - name: Build and package
        run: ./package-mac.sh

      # The oldest macOS each program and library inside the app accepts: the
      # highest of them is the oldest macOS the app runs on.
      - name: Minimum macOS
        run: |
          find dist/DefDownloader.app -type f \( -name '*.dylib' -o -perm -u+x \) | while read -r file; do
            minos="$(otool -l "$file" 2>/dev/null | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
            [ -n "$minos" ] && echo "$minos $file"
          done | sort -t. -k1,1n -k2,2n > minos.txt
          cut -d' ' -f1 minos.txt | uniq -c
          tail -n 3 minos.txt
          echo "::notice::The app needs macOS $(tail -n 1 minos.txt | cut -d' ' -f1) or later"

      # Runs the app from the disk image, as on a Mac that has nothing installed:
      # Homebrew is put aside, so only what is inside the app can be found.
      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/dmg"
          # A disk image just made is often still busy on the runner: tried again.
          for attempt in $(seq 12); do
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/DefDownloader-macos-arm64.dmg && break
            if [ "$attempt" = 12 ]; then
              echo "::error::the disk image cannot be opened"
              exit 1
            fi
            sleep 10
          done
          app="$RUNNER_TEMP/dmg/DefDownloader.app/Contents/MacOS/DefDownloader"
          sudo mv /opt/homebrew /opt/homebrew.aside
          trap 'sudo mv /opt/homebrew.aside /opt/homebrew' EXIT
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }

          limit 600 env -i HOME="$HOME" PATH=/nonexistent "$app" --selftest > selftest.txt
          grep -v '^      ' selftest.txt
          for tool in yt-dlp ffmpeg spotdl instaloader; do
            if ! grep -Eq "^== $tool: /.+/DefDownloader\.app/Contents/MacOS/$tool\$" selftest.txt; then
              echo "::error::bundled $tool not found"
              exit 1
            fi
          done
          if ! awk '/total options: / { n++; if ($3 < 30) bad = 1 } END { exit !(n == 4 && !bad) }' selftest.txt; then
            echo "::error::options not parsed"
            exit 1
          fi

          limit 180 "$app" --screenshot "$PWD/window.png" 3 login
          test -s window.png

          # The conversion screen with a list of files, made by the bundled ffmpeg.
          ffmpeg="$(dirname "$app")/ffmpeg"
          "$ffmpeg" -v error -f lavfi -i 'sine=frequency=440:duration=30' "$RUNNER_TEMP/Intervista.wav"
          "$ffmpeg" -v error -f lavfi -i 'sine=frequency=330:duration=90' "$RUNNER_TEMP/Lezione.mp3"
          limit 120 "$app" --screenshot "$PWD/convert.png" ffmpeg "$RUNNER_TEMP/Intervista.wav" "$RUNNER_TEMP/Lezione.mp3"
          test -s convert.png

      - uses: actions/upload-artifact@v7
        with:
          name: DefDownloader-macos-arm64
          path: dist/DefDownloader-macos-arm64.dmg

      # Apart from the package, to look at the pictures without downloading it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-smoke-test
          if-no-files-found: ignore
          path: |
            window.png
            convert.png
            selftest.txt
            minos.txt

      # The other builds may be creating the same release at the same moment.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag='${{ github.ref_name }}'
          notes="docs/release-notes/$tag.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --title "DefDownloader ${tag#v}" --notes-file "$notes" --verify-tag \
            || gh release view "$tag" > /dev/null
          gh release upload "$tag" dist/DefDownloader-macos-arm64.dmg --clobber
